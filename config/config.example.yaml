# ManaWoW config example
authserver:
  host: 127.0.0.1
  port: 3724
  realm_id: 1
  realm_name: "ManaWoW-Local"
  # Address advertised to the client in the realm list. Use your LAN IP if
  # the client is not running on the same machine.
  realm_address: 127.0.0.1
  realm_type: 0  # 0 normal
  realm_flags: 0
  realm_population: 0.0
  realm_timezone: 1
  realm_build_min: 12340
  realm_build_max: 12340

worldserver:
  host: 127.0.0.1
  port: 8085
  realm_id: 1
  motd: "Welcome to ManaWoW (experimental)"
  # Copper granted to every new character (CMaNGOS StartPlayerMoney).
  # 100 = one silver; the cheapest class trainer spell costs 10 copper.
  start_money: 0
  # Extracted client collision data. Populate it with
  #   python tools/fetch_client_data.py --preset starter
  # Leave empty to disable terrain/LOS/navmesh and use straight-line movement.
  client_data: "./data/client"

database:
  type: sqlite
  auth_path: "./data/auth.db"
  # Generated by tools/import_wotlk_db.py; not shipped with the repository.
  world_path: "./data/world.db"
  # Characters, inventory and known spells live separately from the world bank.
  character_path: "./data/characters.db"

logging:
  level: INFO
  log_dir: "./logs"
  console: true
  # Write logs/packets_*.log.  Records are queued and flushed by a background
  # thread once per second, so this no longer stalls the game loop.
  packet_log: true

security:
  # Do not use real passwords on public network; this is experimental
  allow_insecure_demo: true
