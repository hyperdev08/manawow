name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Cache pinned CMaNGOS dump
        uses: actions/cache@v4
        with:
          path: data/cache
          key: cmangos-5612dec4fd60

      - name: Generate world database
        run: python tools/import_wotlk_db.py --db data/world.db --combined

      - name: Run tests
        run: pytest -v
